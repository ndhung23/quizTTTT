<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Quiz – Làm bài</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% include 'quiz/styles.html' %}
</head>
<body class="text-white select-none">

  <!-- Theme Toggle Button -->
  <button id="themeToggleBtn" onclick="toggleTheme()" class="fixed top-4 right-4 z-[99] bg-slate-800 hover:bg-slate-700 text-yellow-400 p-2.5 rounded-xl border border-white/10 shadow-lg transition duration-200 active:scale-95 flex items-center justify-center">
    <!-- Sun Icon -->
    <svg id="themeSunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
    </svg>
    <!-- Moon Icon -->
    <svg id="themeMoonIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
  </button>

  {% include 'quiz/screen_join.html' %}
  {% include 'quiz/screen_option1.html' %}
  {% include 'quiz/screen_option2.html' %}
  {% include 'quiz/modals.html' %}
  {% include 'quiz/screen_result.html' %}

  <!-- Floating ghost wrapper for drag & drop -->
  <div id="dragGhost" style="position:fixed; pointer-events:none; z-index:9999; display:none; opacity:0.85;"></div>

  <!-- JS Logic -->
  <script src="{{ url_for('static', filename='js/quiz_data.js') }}?v=1.0.3"></script>
  <script src="{{ url_for('static', filename='js/quiz_state.js') }}?v=1.0.3"></script>
  <script src="{{ url_for('static', filename='js/quiz_option1.js') }}?v=1.0.3"></script>
  <script src="{{ url_for('static', filename='js/quiz_option2.js') }}?v=1.0.3"></script>
  <script src="{{ url_for('static', filename='js/quiz_main.js') }}?v=1.0.3"></script>
</body>
</html>
