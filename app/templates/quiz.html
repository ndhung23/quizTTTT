<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DENSO Quiz – Làm bài</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Card ──────────────────────────────────────────── */
    .card {
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: box-shadow .15s, opacity .15s, transform .1s;
      position: relative;
    }
    .card:active  { cursor: grabbing; }
    .card.is-dragging { opacity: .35; transform: scale(.96); }

    /* ── Floating ghost while dragging ──────────────────── */
    #dragGhost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: .9;
      transform: rotate(2deg) scale(1.06);
      box-shadow: 0 24px 48px rgba(0,0,0,.45);
      border-radius: .75rem;
      overflow: hidden;
      display: none;
    }

    /* ── Drop slot ──────────────────────────────────────── */
    .slot {
      transition: background .15s, border-color .15s, transform .1s;
      min-height: 90px;
    }
    .slot.over {
      background: #dbeafe !important;
      border-color: #3b82f6 !important;
      transform: scale(1.02);
    }
    .slot .placeholder {
      pointer-events: none;
    }

    /* Scrollable source row */
    #sourceRow {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    #sourceRow::-webkit-scrollbar { height: 4px; }
    #sourceRow::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-900 to-blue-950 text-white select-none">

<!-- ══════════════════════════════════════════════════════════
     SCREEN 1 – JOIN
══════════════════════════════════════════════════════════ -->
<div id="screenJoin" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white text-gray-800 rounded-2xl shadow-2xl w-full max-w-sm p-8">

    <div class="text-center mb-7">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl mb-3 shadow">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
               M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
      </div>
      <h1 class="text-xl font-black text-gray-900">DENSO Quiz</h1>
      <p class="text-gray-500 text-sm mt-1">Sắp xếp các bước thao tác đúng thứ tự</p>
    </div>

    <form id="joinForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Mã phòng</label>
        <input id="codeInput" type="text" maxlength="10" required autocomplete="off"
          placeholder="Nhập mã 6 chữ số"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500
                 text-center text-2xl font-black tracking-[.3em] uppercase transition"
        />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wide">Tên của bạn</label>
        <input id="nameInput" type="text" maxlength="50" required
          placeholder="Nguyễn Văn A"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 transition"
        />
      </div>

      <div id="joinError" class="hidden bg-red-50 border border-red-300 text-red-600 text-sm rounded-xl px-4 py-3 text-center"></div>

      <button type="submit" id="joinBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 rounded-xl
               transition flex items-center justify-center gap-2 text-base">
        <span>Vào làm bài</span>
        <svg id="joinSpinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
      </button>
    </form>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     SCREEN 2 – QUIZ  (hàng ngang ảnh nguồn → kéo xuống slot)
══════════════════════════════════════════════════════════ -->
<div id="screenQuiz" class="hidden flex flex-col min-h-screen">

  <!-- Top bar -->
  <div class="bg-slate-900/80 backdrop-blur border-b border-white/10 px-4 py-3 flex items-center justify-between">
    <div>
      <p class="font-black text-base leading-tight">Sắp xếp đúng thứ tự</p>
      <p class="text-blue-300 text-xs mt-0.5">Kéo ảnh từ <span class="font-semibold text-yellow-300">hàng trên</span> xuống ô bên dưới</p>
    </div>
    <div class="text-right">
      <p class="text-xs text-slate-400">Học viên</p>
      <p id="displayName" class="font-bold text-sm text-white"></p>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto p-3 space-y-4 pb-24">

    <!-- SOURCE ROW: 7 ảnh xếp ngang, cuộn ngang nếu tràn -->
    <div class="bg-white/10 backdrop-blur rounded-2xl p-3">
      <p class="text-xs font-semibold text-blue-200 uppercase tracking-wide mb-2 px-1">
        📦 Kho ảnh – kéo xuống ô bên dưới
      </p>
      <div id="sourceRow" class="flex gap-3 pb-1">
        <!-- cards injected by JS -->
      </div>
    </div>

    <!-- SLOTS: 7 ô xếp 2 cột (col-span-1 + col-span-1, slot 7 ở giữa) -->
    <div class="bg-white/10 backdrop-blur rounded-2xl p-3">
      <p class="text-xs font-semibold text-green-200 uppercase tracking-wide mb-2 px-1">
        📋 Thứ tự đúng – thả ảnh vào đây (1 → 7)
      </p>
      <div id="slotGrid" class="grid grid-cols-2 gap-3">
        <!-- slots injected by JS -->
      </div>
    </div>

  </div>

  <!-- Fixed bottom bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-white/10 px-4 py-3">
    <div class="flex items-center justify-between gap-3 max-w-xl mx-auto">
      <p id="progressText" class="text-sm text-slate-300 truncate"></p>
      <button id="submitBtn" onclick="submitQuiz()"
        class="shrink-0 bg-emerald-500 hover:bg-emerald-600 active:scale-95 disabled:opacity-40
               disabled:cursor-not-allowed text-white font-bold px-6 py-2.5 rounded-xl transition text-sm
               flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        Nộp bài
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     SCREEN 3 – RESULT
══════════════════════════════════════════════════════════ -->
<div id="screenResult" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="bg-white text-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-7 text-center">
    <div id="resultEmoji" class="text-6xl mb-3">🎉</div>
    <h2 id="resultTitle" class="text-3xl font-black mb-1"></h2>
    <p id="resultSub"    class="text-gray-500 text-sm mb-5"></p>

    <div class="inline-flex items-center justify-center w-32 h-32 rounded-full border-8 border-indigo-500 mb-5">
      <div>
        <p id="scoreDisplay" class="text-4xl font-black text-indigo-600"></p>
        <p class="text-xs text-gray-400">đúng</p>
      </div>
    </div>

    <div class="bg-gray-50 rounded-xl p-4 mb-5 text-left space-y-2">
      <p class="text-xs font-bold text-gray-600 uppercase tracking-wide mb-3">Chi tiết từng bước</p>
      <div id="answerDetail"></div>
    </div>
    <p class="text-xs text-gray-400">Kết quả đã ghi nhận. Cảm ơn bạn! 👍</p>
  </div>
</div>

<!-- Floating drag ghost (shared) -->
<div id="dragGhost"></div>

<script>
// ═══════════════════════════════════════════════════════
//  Constants & State
// ═══════════════════════════════════════════════════════
const TOTAL  = 7;
let studentId   = null;
let studentName = '';
let slots       = Array(TOTAL).fill(null);   // slots[0..6] = step# | null
let unplaced    = [];                         // step numbers not yet placed

// ═══════════════════════════════════════════════════════
//  URL pre-fill
// ═══════════════════════════════════════════════════════
const _code = new URLSearchParams(location.search).get('code');
if (_code) document.getElementById('codeInput').value = _code.toUpperCase();

// ═══════════════════════════════════════════════════════
//  JOIN
// ═══════════════════════════════════════════════════════
document.getElementById('joinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn     = document.getElementById('joinBtn');
  const spinner = document.getElementById('joinSpinner');
  const errEl   = document.getElementById('joinError');
  btn.disabled  = true;
  spinner.classList.remove('hidden');
  errEl.classList.add('hidden');

  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();

  try {
    const res  = await fetch('/quiz/join', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, code })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.detail || 'Mã không hợp lệ'; errEl.classList.remove('hidden'); return; }
    studentId   = data.student_id;
    studentName = name;
    document.getElementById('displayName').textContent = name;
    initQuiz();
  } catch {
    errEl.textContent = 'Lỗi kết nối server.';
    errEl.classList.remove('hidden');
  } finally { btn.disabled = false; spinner.classList.add('hidden'); }
});

// ═══════════════════════════════════════════════════════
//  INIT QUIZ
// ═══════════════════════════════════════════════════════
function initQuiz() {
  document.getElementById('screenJoin').classList.add('hidden');
  document.getElementById('screenQuiz').classList.remove('hidden');
  slots    = Array(TOTAL).fill(null);
  unplaced = shuffle([1,2,3,4,5,6,7]);
  render();
}

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function render() {
  renderSource();
  renderSlots();
  renderProgress();
}

function renderSource() {
  const row = document.getElementById('sourceRow');
  row.innerHTML = '';
  if (unplaced.length === 0) {
    row.innerHTML = '<p class="text-white/40 text-sm py-4 px-2 italic">Đã dùng hết ảnh ✅</p>';
    return;
  }
  unplaced.forEach(step => row.appendChild(makeCard(step, 'source')));
}

function renderSlots() {
  const grid = document.getElementById('slotGrid');
  grid.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const zone = document.createElement('div');
    // slot 6 (index 6) spans 2 cols to center it
    zone.className = 'slot border-2 border-dashed border-white/20 rounded-xl p-2 flex items-center gap-2'
      + (i === 6 ? ' col-span-2 max-w-[50%] mx-auto w-full' : '');
    zone.dataset.slot = i;

    // Number badge
    const badge = document.createElement('div');
    badge.className = 'shrink-0 w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-white font-bold text-xs';
    badge.textContent = i + 1;
    zone.appendChild(badge);

    const body = document.createElement('div');
    body.className = 'flex-1 min-w-0';
    if (slots[i] !== null) {
      body.appendChild(makeCard(slots[i], 'slot-' + i));
    } else {
      body.innerHTML = '<p class="placeholder text-white/30 text-xs italic text-center py-4">thả vào đây</p>';
    }
    zone.appendChild(body);

    // Drop listeners
    zone.addEventListener('dragover', onDragOver);
    zone.addEventListener('dragleave', onDragLeave);
    zone.addEventListener('drop', onDrop);
    grid.appendChild(zone);
  }
}

function renderProgress() {
  const n = slots.filter(s => s !== null).length;
  document.getElementById('progressText').textContent =
    n === TOTAL ? '✅ Đủ 7 bước – bấm Nộp bài!'
                : `Đã xếp ${n}/${TOTAL} bước`;
  document.getElementById('submitBtn').disabled = n !== TOTAL;
}

// ═══════════════════════════════════════════════════════
//  MAKE CARD
// ═══════════════════════════════════════════════════════
function makeCard(step, origin) {
  const wrap = document.createElement('div');
  wrap.className = 'card bg-white rounded-xl overflow-hidden shadow-md border-2 border-transparent hover:border-indigo-400';
  wrap.style.cssText = 'width:90px; flex-shrink:0';
  wrap.dataset.step   = step;
  wrap.dataset.origin = origin;
  wrap.draggable      = true;

  wrap.innerHTML = `
    <img src="/images/${step}.png" alt="Bước ${step}"
         style="width:100%;aspect-ratio:4/3;object-fit:cover;pointer-events:none;display:block" />
    <div class="bg-gray-50 py-1 text-center">
      <span class="text-[10px] font-semibold text-gray-400">Bước ?</span>
    </div>`;

  // Desktop
  wrap.addEventListener('dragstart', onDragStart);
  wrap.addEventListener('dragend',   onDragEnd);
  // Touch
  wrap.addEventListener('touchstart', onTouchStart, { passive: false });
  wrap.addEventListener('touchmove',  onTouchMove,  { passive: false });
  wrap.addEventListener('touchend',   onTouchEnd);
  return wrap;
}

// ═══════════════════════════════════════════════════════
//  DRAG STATE
// ═══════════════════════════════════════════════════════
let dStep = null, dFrom = null, dEl = null;

// ── Desktop drag ──────────────────────────────────────
function onDragStart(e) {
  dStep = +this.dataset.step;
  dFrom = this.dataset.origin;
  dEl   = this;
  this.classList.add('is-dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dStep);
}
function onDragEnd() { this.classList.remove('is-dragging'); }

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  this.classList.add('over');
}
function onDragLeave(e) {
  // only remove if we actually left the zone (not just entered a child)
  if (!this.contains(e.relatedTarget)) this.classList.remove('over');
}
function onDrop(e) {
  e.preventDefault();
  this.classList.remove('over');
  const idx = +this.dataset.slot;
  if (!isNaN(idx)) place(dStep, dFrom, idx);
}

// ── Touch drag ────────────────────────────────────────
const ghost = document.getElementById('dragGhost');
let tStep = null, tFrom = null, tEl = null;

function onTouchStart(e) {
  e.preventDefault();
  const t = e.touches[0];
  tStep = +this.dataset.step;
  tFrom = this.dataset.origin;
  tEl   = this;

  // Build ghost
  ghost.innerHTML = '';
  const clone = this.cloneNode(true);
  clone.style.cssText = '';
  ghost.appendChild(clone);
  ghost.style.width  = this.offsetWidth + 'px';
  ghost.style.display = 'block';
  moveGhost(t.clientX, t.clientY);

  this.classList.add('is-dragging');
}

function onTouchMove(e) {
  e.preventDefault();
  const t = e.touches[0];
  moveGhost(t.clientX, t.clientY);

  // highlight slot under finger
  ghost.style.display = 'none';
  const el   = document.elementFromPoint(t.clientX, t.clientY);
  ghost.style.display = 'block';
  document.querySelectorAll('.slot').forEach(z => z.classList.remove('over'));
  const zone = el && el.closest('.slot');
  if (zone) zone.classList.add('over');
}

function onTouchEnd(e) {
  const t = e.changedTouches[0];
  ghost.style.display = 'none';
  if (tEl) tEl.classList.remove('is-dragging');
  document.querySelectorAll('.slot').forEach(z => z.classList.remove('over'));

  ghost.style.display = 'none';
  const el   = document.elementFromPoint(t.clientX, t.clientY);
  ghost.style.display = 'none';
  const zone = el && el.closest('.slot');
  if (zone) {
    const idx = +zone.dataset.slot;
    if (!isNaN(idx)) place(tStep, tFrom, idx);
  }

  tStep = tFrom = tEl = null;
}

function moveGhost(cx, cy) {
  ghost.style.left = (cx - ghost.offsetWidth / 2)  + 'px';
  ghost.style.top  = (cy - ghost.offsetHeight / 2) + 'px';
}

// ═══════════════════════════════════════════════════════
//  PLACE LOGIC
// ═══════════════════════════════════════════════════════
function place(step, from, targetIdx) {
  const displaced = slots[targetIdx];

  // Remove from origin
  if (from === 'source') {
    unplaced = unplaced.filter(s => s !== step);
  } else if (from.startsWith('slot-')) {
    slots[+from.split('-')[1]] = null;
  }

  // Set target
  slots[targetIdx] = step;

  // Push displaced back to source (if different)
  if (displaced !== null && displaced !== step) unplaced.push(displaced);

  render();
}

// ═══════════════════════════════════════════════════════
//  SUBMIT
// ═══════════════════════════════════════════════════════
async function submitQuiz() {
  if (slots.some(s => s === null)) {
    alert('Chưa đủ 7 bước!');
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/></svg> Đang nộp…';

  try {
    const res  = await fetch('/quiz/submit', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ student_id: studentId, answer_order: slots })
    });
    const data = await res.json();
    if (!res.ok) { alert(data.detail || 'Lỗi nộp bài'); return; }
    showResult(data);
  } catch { alert('Lỗi kết nối.'); }
  finally {
    btn.disabled = false;
    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Nộp bài';
  }
}

// ═══════════════════════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════════════════════
function showResult(data) {
  document.getElementById('screenQuiz').classList.add('hidden');
  document.getElementById('screenResult').classList.remove('hidden');

  const pct  = Math.round(data.score / data.total * 100);
  const emoji = pct===100?'🏆':pct>=70?'🎉':pct>=40?'👍':'💪';
  const title = pct===100?'Hoàn hảo!':pct>=70?'Xuất sắc!':pct>=40?'Khá tốt!':'Cố gắng hơn!';

  document.getElementById('resultEmoji').textContent  = emoji;
  document.getElementById('resultTitle').textContent  = title;
  document.getElementById('resultSub').textContent    = `${studentName} – ${data.score}/${data.total} đúng (${pct}%)`;
  document.getElementById('scoreDisplay').textContent = `${data.score}/${data.total}`;

  const detail = document.getElementById('answerDetail');
  detail.innerHTML = '';
  slots.forEach((step, i) => {
    const ok   = step === data.correct_order[i];
    const row  = document.createElement('div');
    row.className = `flex items-center gap-2 p-2 rounded-lg text-sm ${ok?'bg-green-50':'bg-red-50'}`;
    row.innerHTML  = `
      <span>${ok?'✅':'❌'}</span>
      <span class="font-semibold text-gray-700">Vị trí ${i+1}:</span>
      <span class="${ok?'text-green-700':'text-red-600'}">
        Bước ${step}
        ${!ok?`<span class="text-gray-400 text-xs">(đúng: Bước ${data.correct_order[i]})</span>`:''}
      </span>`;
    detail.appendChild(row);
  });
}
</script>
</body>
</html>
