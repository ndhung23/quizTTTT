<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DENSO Quiz – Làm bài</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .drag-item {
      cursor: grab;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      touch-action: none;
      user-select: none;
    }
    .drag-item:active { cursor: grabbing; }
    .drag-item.dragging {
      opacity: 0.4;
      transform: scale(0.97);
    }
    .drop-zone {
      transition: background 0.15s, border-color 0.15s;
      min-height: 80px;
    }
    .drop-zone.drag-over {
      background: #dbeafe;
      border-color: #3b82f6;
    }
    .img-card {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 0.5rem;
      pointer-events: none;
    }
    /* Touch drag ghost */
    .touch-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.85;
      transform: scale(1.05);
      border-radius: 0.75rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-blue-950 to-indigo-900 text-white">

  <!-- ════════════════════════════════════════
       STEP 1 – JOIN SCREEN
  ════════════════════════════════════════ -->
  <div id="joinScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white text-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-8">

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-full mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold">DENSO Quiz</h1>
        <p class="text-gray-500 text-sm mt-1">Sắp xếp các bước thao tác đúng thứ tự</p>
      </div>

      <form id="joinForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mã phòng</label>
          <input type="text" id="codeInput" maxlength="10" required
            placeholder="Nhập mã 6 chữ số"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-2xl font-bold tracking-widest uppercase transition"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tên của bạn</label>
          <input type="text" id="nameInput" required maxlength="50"
            placeholder="Nguyễn Văn A"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          />
        </div>

        <div id="joinError" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3"></div>

        <button type="submit" id="joinBtn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
          <span>Vào làm bài</span>
          <svg id="joinSpinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       STEP 2 – QUIZ SCREEN (Drag & Drop)
  ════════════════════════════════════════ -->
  <div id="quizScreen" class="hidden min-h-screen p-4 pb-32">

    <!-- Header -->
    <div class="max-w-6xl mx-auto mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold">Sắp xếp các bước thao tác</h1>
          <p class="text-blue-300 text-sm mt-1">Kéo và thả hình ảnh vào đúng vị trí (1 → 7)</p>
        </div>
        <div class="text-right">
          <p class="text-sm text-gray-400">Học viên</p>
          <p id="displayName" class="font-bold text-lg"></p>
        </div>
      </div>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- LEFT: Source images (shuffled) -->
      <div class="bg-white/10 backdrop-blur rounded-2xl p-5">
        <h2 class="font-semibold text-blue-200 mb-4 flex items-center gap-2">
          <span class="bg-blue-500 text-white text-xs px-2 py-1 rounded-full">Ảnh</span>
          Các bước (kéo sang phải)
        </h2>
        <div id="sourceGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 xl:grid-cols-3 gap-3">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- RIGHT: Drop zones (ordered slots 1-7) -->
      <div class="bg-white/10 backdrop-blur rounded-2xl p-5">
        <h2 class="font-semibold text-blue-200 mb-4 flex items-center gap-2">
          <span class="bg-green-500 text-white text-xs px-2 py-1 rounded-full">Thứ tự</span>
          Vị trí thứ tự (1 → 7)
        </h2>
        <div id="dropZones" class="space-y-3">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <!-- Submit bar (fixed bottom) -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur border-t border-white/10 p-4">
      <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
        <p class="text-sm text-gray-400" id="progressText">Chưa sắp xếp bước nào</p>
        <button id="submitBtn" onclick="submitQuiz()"
          class="bg-green-500 hover:bg-green-600 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold px-8 py-3 rounded-xl transition flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Hoàn thành &amp; Nộp bài
        </button>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       STEP 3 – RESULT SCREEN
  ════════════════════════════════════════ -->
  <div id="resultScreen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white text-gray-800 rounded-2xl shadow-2xl w-full max-w-lg p-8 text-center">

      <div id="resultIcon" class="text-7xl mb-4">🎉</div>
      <h2 class="text-3xl font-black mb-2" id="resultTitle">Kết quả</h2>
      <p class="text-gray-500 mb-6" id="resultSub"></p>

      <!-- Score circle -->
      <div class="inline-flex items-center justify-center w-36 h-36 rounded-full border-8 border-blue-500 mb-6">
        <div>
          <p id="scoreDisplay" class="text-4xl font-black text-blue-600"></p>
          <p class="text-xs text-gray-500">điểm đúng</p>
        </div>
      </div>

      <!-- Answer comparison -->
      <div class="bg-gray-50 rounded-xl p-4 mb-6 text-left">
        <p class="font-semibold text-gray-700 mb-3 text-sm">Chi tiết từng bước:</p>
        <div id="answerDetail" class="space-y-2 text-sm"></div>
      </div>

      <div class="text-sm text-gray-500">Kết quả đã được ghi nhận. Cảm ơn bạn! 👍</div>
    </div>
  </div>

  <script>
  // ─────────────────────────────────────────────────────────────
  //  State
  // ─────────────────────────────────────────────────────────────
  const TOTAL = 7;
  const STEP_LABELS = [
    'Đeo đồ bảo hộ',
    'Đặt Terminal SA lên khuôn',
    'Lấy sản phẩm từ khuôn, đặt vào băng tải',
    'Set Terminal S/A vào khuôn',
    'Lấy terminal ngắn từ khay',
    'Set terminal ngắn vào khuôn',
    'Lấy terminal dài từ khay',
  ];

  let studentId = null;
  let studentName = '';
  // slots[position 0-6] = step number (1-7) or null
  let slots = Array(TOTAL).fill(null);
  // source items remaining (step numbers not yet placed)
  let unplaced = [];

  // ─────────────────────────────────────────────────────────────
  //  Pre-fill code from URL query
  // ─────────────────────────────────────────────────────────────
  const urlParams = new URLSearchParams(window.location.search);
  const codeFromUrl = urlParams.get('code');
  if (codeFromUrl) {
    document.getElementById('codeInput').value = codeFromUrl.toUpperCase();
  }

  // ─────────────────────────────────────────────────────────────
  //  JOIN
  // ─────────────────────────────────────────────────────────────
  document.getElementById('joinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('joinBtn');
    const spinner = document.getElementById('joinSpinner');
    const errEl = document.getElementById('joinError');

    btn.disabled = true;
    spinner.classList.remove('hidden');
    errEl.classList.add('hidden');

    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    const name = document.getElementById('nameInput').value.trim();

    try {
      const res = await fetch('/quiz/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, code }),
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.detail || 'Không thể vào phòng. Kiểm tra lại mã.';
        errEl.classList.remove('hidden');
        return;
      }

      studentId = data.student_id;
      studentName = name;
      document.getElementById('displayName').textContent = name;
      showQuizScreen();

    } catch {
      errEl.textContent = 'Lỗi kết nối server.';
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      spinner.classList.add('hidden');
    }
  });

  // ─────────────────────────────────────────────────────────────
  //  BUILD QUIZ UI
  // ─────────────────────────────────────────────────────────────
  function showQuizScreen() {
    document.getElementById('joinScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    // Shuffle step numbers 1-7
    unplaced = shuffleArray([1, 2, 3, 4, 5, 6, 7]);
    renderSource();
    renderDropZones();
    updateProgress();
  }

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderSource() {
    const grid = document.getElementById('sourceGrid');
    grid.innerHTML = '';
    unplaced.forEach(step => {
      grid.appendChild(makeCard(step, 'source'));
    });
  }

  function makeCard(step, origin) {
    const div = document.createElement('div');
    div.className = 'drag-item bg-white rounded-xl shadow-lg overflow-hidden border-2 border-transparent hover:border-blue-400';
    div.dataset.step = step;
    div.dataset.origin = origin;
    div.draggable = true;

    div.innerHTML = `
      <img src="/images/${step}.png" alt="Bước ${step}" class="img-card" />
      <div class="bg-white px-2 py-1 text-center">
        <span class="text-xs font-semibold text-gray-500">Bước ?</span>
      </div>
    `;

    // Desktop drag events
    div.addEventListener('dragstart', onDragStart);
    div.addEventListener('dragend', onDragEnd);

    // Mobile touch events
    div.addEventListener('touchstart', onTouchStart, { passive: false });
    div.addEventListener('touchmove', onTouchMove, { passive: false });
    div.addEventListener('touchend', onTouchEnd);

    return div;
  }

  function renderDropZones() {
    const container = document.getElementById('dropZones');
    container.innerHTML = '';
    for (let i = 0; i < TOTAL; i++) {
      container.appendChild(makeDropZone(i));
    }
  }

  function makeDropZone(index) {
    const zone = document.createElement('div');
    zone.className = 'drop-zone border-2 border-dashed border-white/30 rounded-xl p-2 flex items-center gap-3 min-h-[80px]';
    zone.dataset.slot = index;

    const label = document.createElement('div');
    label.className = 'flex-shrink-0 w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white font-bold text-sm';
    label.textContent = index + 1;
    zone.appendChild(label);

    const content = document.createElement('div');
    content.className = 'flex-1';
    content.id = `slot-content-${index}`;

    if (slots[index] !== null) {
      content.appendChild(makeCard(slots[index], `slot-${index}`));
    } else {
      content.innerHTML = `<p class="text-white/40 text-sm italic">Kéo ảnh vào đây...</p>`;
    }
    zone.appendChild(content);

    // Drag over / drop
    zone.addEventListener('dragover', onDragOver);
    zone.addEventListener('dragleave', onDragLeave);
    zone.addEventListener('drop', onDrop);

    return zone;
  }

  function updateProgress() {
    const filled = slots.filter(s => s !== null).length;
    const pct = Math.round((filled / TOTAL) * 100);
    document.getElementById('progressText').textContent =
      filled === TOTAL
        ? '✅ Đã sắp xếp đủ 7 bước – bấm Hoàn thành để nộp!'
        : `Đã sắp xếp ${filled}/${TOTAL} bước (${pct}%)`;
  }

  // ─────────────────────────────────────────────────────────────
  //  DESKTOP DRAG & DROP
  // ─────────────────────────────────────────────────────────────
  let draggedStep = null;
  let draggedFrom = null;   // 'source' or 'slot-N'

  function onDragStart(e) {
    draggedStep = parseInt(this.dataset.step);
    draggedFrom = this.dataset.origin;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedStep);
  }

  function onDragEnd(e) {
    this.classList.remove('dragging');
  }

  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.classList.add('drag-over');
  }

  function onDragLeave(e) {
    this.classList.remove('drag-over');
  }

  function onDrop(e) {
    e.preventDefault();
    this.classList.remove('drag-over');
    const targetSlot = parseInt(this.dataset.slot);
    if (isNaN(targetSlot)) return;
    placeStep(draggedStep, draggedFrom, targetSlot);
  }

  // ─────────────────────────────────────────────────────────────
  //  MOBILE TOUCH DRAG
  // ─────────────────────────────────────────────────────────────
  let touchGhost = null;
  let touchDraggedEl = null;
  let touchDraggedStep = null;
  let touchDraggedFrom = null;

  function onTouchStart(e) {
    e.preventDefault();
    const touch = e.touches[0];
    touchDraggedEl = this;
    touchDraggedStep = parseInt(this.dataset.step);
    touchDraggedFrom = this.dataset.origin;

    // Create ghost
    touchGhost = this.cloneNode(true);
    touchGhost.className = 'touch-ghost bg-white rounded-xl shadow-2xl overflow-hidden';
    touchGhost.style.width = this.offsetWidth + 'px';
    touchGhost.style.left = (touch.clientX - this.offsetWidth / 2) + 'px';
    touchGhost.style.top = (touch.clientY - this.offsetHeight / 2) + 'px';
    document.body.appendChild(touchGhost);

    this.style.opacity = '0.3';
  }

  function onTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    if (touchGhost) {
      touchGhost.style.left = (touch.clientX - touchGhost.offsetWidth / 2) + 'px';
      touchGhost.style.top = (touch.clientY - touchGhost.offsetHeight / 2) + 'px';
    }
    // Highlight drop zone under finger
    document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const zone = el && el.closest('.drop-zone');
    if (zone) zone.classList.add('drag-over');
  }

  function onTouchEnd(e) {
    const touch = e.changedTouches[0];
    if (touchGhost) {
      touchGhost.remove();
      touchGhost = null;
    }
    if (touchDraggedEl) touchDraggedEl.style.opacity = '';

    document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));

    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const zone = el && el.closest('.drop-zone');
    if (zone) {
      const targetSlot = parseInt(zone.dataset.slot);
      if (!isNaN(targetSlot)) {
        placeStep(touchDraggedStep, touchDraggedFrom, targetSlot);
      }
    }

    touchDraggedEl = null;
    touchDraggedStep = null;
    touchDraggedFrom = null;
  }

  // ─────────────────────────────────────────────────────────────
  //  CORE: place a step into a slot
  // ─────────────────────────────────────────────────────────────
  function placeStep(step, from, targetSlot) {
    // If target slot is occupied, swap or return to source
    const displaced = slots[targetSlot];

    // Remove step from its origin
    if (from === 'source') {
      unplaced = unplaced.filter(s => s !== step);
    } else if (from.startsWith('slot-')) {
      const fromSlot = parseInt(from.split('-')[1]);
      slots[fromSlot] = null;
    }

    // Place step into target slot
    slots[targetSlot] = step;

    // If displaced, send back to source
    if (displaced !== null && displaced !== step) {
      unplaced.push(displaced);
    }

    // Re-render
    renderSource();
    renderDropZones();
    updateProgress();
  }

  // ─────────────────────────────────────────────────────────────
  //  SUBMIT
  // ─────────────────────────────────────────────────────────────
  async function submitQuiz() {
    if (slots.some(s => s === null)) {
      alert('Bạn chưa sắp xếp đủ 7 bước! Hãy kéo tất cả ảnh vào vị trí.');
      return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Đang nộp...';

    try {
      const res = await fetch('/quiz/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          student_id: studentId,
          answer_order: slots,
        }),
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.detail || 'Lỗi nộp bài');
        btn.disabled = false;
        btn.textContent = 'Hoàn thành & Nộp bài';
        return;
      }

      showResult(data);

    } catch {
      alert('Lỗi kết nối. Thử lại.');
      btn.disabled = false;
      btn.textContent = 'Hoàn thành & Nộp bài';
    }
  }

  // ─────────────────────────────────────────────────────────────
  //  RESULT SCREEN
  // ─────────────────────────────────────────────────────────────
  function showResult(data) {
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');

    const pct = Math.round((data.score / data.total) * 100);
    const icon = pct === 100 ? '🏆' : pct >= 70 ? '🎉' : pct >= 40 ? '👍' : '💪';

    document.getElementById('resultIcon').textContent = icon;
    document.getElementById('resultTitle').textContent =
      pct === 100 ? 'Hoàn hảo!' : pct >= 70 ? 'Xuất sắc!' : pct >= 40 ? 'Khá tốt!' : 'Cố gắng hơn nhé!';
    document.getElementById('resultSub').textContent =
      `${studentName} – ${data.score}/${data.total} bước đúng (${pct}%)`;
    document.getElementById('scoreDisplay').textContent = `${data.score}/${data.total}`;

    // Detail comparison
    const detail = document.getElementById('answerDetail');
    detail.innerHTML = '';
    slots.forEach((step, i) => {
      const correct = data.correct_order[i];
      const isRight = step === correct;
      const row = document.createElement('div');
      row.className = `flex items-center gap-3 p-2 rounded-lg ${isRight ? 'bg-green-50' : 'bg-red-50'}`;
      row.innerHTML = `
        <span class="text-lg">${isRight ? '✅' : '❌'}</span>
        <div class="flex-1">
          <span class="font-semibold text-gray-700">Vị trí ${i + 1}:</span>
          <span class="${isRight ? 'text-green-700' : 'text-red-600'} ml-1">
            Bạn chọn Bước ${step}
            ${!isRight ? `<span class="text-gray-400">(đúng: Bước ${correct})</span>` : ''}
          </span>
        </div>
      `;
      detail.appendChild(row);
    });
  }
  </script>
</body>
</html>
