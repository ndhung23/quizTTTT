<!-- SCREEN 4 – RESULT SCREEN -->
<div id="screenResult" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="bg-white text-gray-800 rounded-3xl shadow-2xl w-full max-w-md p-8 text-center border border-gray-100">
    <div id="resultEmoji" class="text-7xl mb-4 animate-bounce">🎉</div>
    <h2 id="resultTitle" class="text-2xl font-black text-gray-900 mb-1">Hoàn hảo!</h2>
    <p id="resultSub" class="text-gray-500 text-sm font-medium mb-6"></p>

    <div class="inline-flex items-center justify-center w-36 h-36 rounded-full border-[10px] border-blue-500 mb-6 shadow-inner">
      <div>
        <p id="scoreDisplay" class="text-4xl font-black text-blue-600"></p>
        <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">đúng</p>
      </div>
    </div>

    <div class="bg-gray-50 rounded-2xl p-4 mb-6 text-left space-y-2 border border-gray-200">
      <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Kết quả chung</p>
      <div id="answerDetail" class="space-y-1 max-h-[200px] overflow-y-auto pr-1"></div>
    </div>
    
    <button id="retakeBtn" onclick="retakeQuiz()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-2xl transition mb-2 shadow flex items-center justify-center gap-1.5 active:scale-[0.98]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Làm lại bài thi
    </button>
    <button onclick="clearStudentSession(); window.location.reload();" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 rounded-2xl transition text-sm">
      Quay lại đăng nhập
    </button>
  </div>
</div>
