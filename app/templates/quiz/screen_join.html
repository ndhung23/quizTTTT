<!-- SCREEN 1 – JOIN SCREEN -->
<div id="screenJoin" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white text-gray-800 rounded-3xl shadow-2xl w-full max-w-md p-8 border border-gray-100">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-500/20">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
               M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
      </div>
      <h1 class="text-2xl font-black text-gray-900 tracking-tight">Quiz</h1>
      <p class="text-gray-500 text-sm mt-1 font-medium">Hệ thống kiểm tra kỹ năng thao tác</p>
    </div>

    <form id="joinForm" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wider">Mã phòng thi</label>
        <input id="codeInput" type="text" maxlength="10" required autocomplete="off"
          placeholder="Nhập mã 6 chữ số"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500
                 text-center text-3xl font-black tracking-[0.25em] uppercase transition"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wider">Họ và tên học viên</label>
        <input id="nameInput" type="text" maxlength="50" required
          placeholder="Nguyễn Văn A"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500 transition font-medium text-gray-800"
        />
      </div>

      <div id="joinError" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-2xl px-4 py-3 text-center font-medium"></div>

      <button type="submit" id="joinBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-4 rounded-2xl
               transition shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2 text-base">
        <span>Bắt đầu bài thi</span>
        <svg id="joinSpinner" class="hidden w-5 h-5 animate-spin text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
      </button>
    </form>
  </div>
</div>
